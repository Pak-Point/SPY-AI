<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101426"><title>SPY AI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header><div class="mark">✦</div><div><h1>SPY AI</h1><p>تصویر سے AI ویڈیو بنائیں</p></div><span class="pill">BETA</span></header>
    <section class="panel">
      <label class="section-title" for="imageInput">1۔ اپنی تصویر منتخب کریں</label>
      <label class="upload" for="imageInput"><span class="upload-icon">＋</span><strong id="uploadText">تصویر اپلوڈ کریں</strong><small>JPG، PNG یا WEBP — زیادہ سے زیادہ 10 MB</small></label>
      <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <img id="preview" alt="منتخب تصویر کا پیش منظر" hidden>
      <label class="section-title" for="prompt">2۔ ویڈیو کا Prompt لکھیں</label>
      <textarea id="prompt" maxlength="1200" placeholder="مثال: تصویر میں موجود منظر کو حقیقت کے قریب حرکت دیں، کیمرہ آہستہ آگے بڑھے، قدرتی روشنی اور ہموار cinematic motion..."></textarea>
      <div class="hint">Prompt انگلش میں لکھنے سے عموماً بہتر نتائج ملتے ہیں۔</div>
      <div class="options">
        <div><label for="duration">دورانیہ</label><select id="duration"><option value="5">5 سیکنڈ</option><option value="8">8 سیکنڈ</option><option value="10">10 سیکنڈ</option><option value="12">12 سیکنڈ</option></select></div>
        <div><label for="ratio">ویڈیو سائز</label><select id="ratio"><option value="9:16">موبائل 9:16</option><option value="16:9">وائیڈ 16:9</option><option value="1:1">اسکوائر 1:1</option></select></div>
        <div><label for="resolution">کوالٹی</label><select id="resolution"><option value="720p">720p</option><option value="480p">480p</option><option value="1080p">1080p</option></select></div>
      </div>
      <button id="generate">✦ ویڈیو بنائیں</button>
      <p class="notice">ویڈیو جنریشن کے لیے فعال API اور کریڈٹ درکار ہیں۔ ہر جنریشن کی قیمت منتخب ماڈل اور دورانیے کے مطابق ہو سکتی ہے۔</p>
      <div id="status" role="status" aria-live="polite"></div>
      <video id="result" controls playsinline hidden></video>
      <a id="download" class="download" hidden download="spy-ai-video.mp4">ویڈیو ڈاؤن لوڈ کریں</a>
    </section>
    <footer>© SPY AI · آپ کی تصویر، آپ کا تخلیقی خیال</footer>
  </main>
  <script src="app.js"></script>
</body></html>
